name: Linting
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Use the maintained v4 action and a current Node LTS
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'          # keep this in sync with local dev
          cache: 'npm'                # speeds up, safe for optional deps
      # Pin npm to a modern major (fixes optional-deps glitches seen in npm 9.x)
      - name: Upgrade npm
        run: npm i -g npm@^11
      - name: Install
        run: npm install
        # disabled for now:
        # - name: Check finds incorrect imports from xyflow, but they are actually correct
        # run: npm run check
      - name: Lint Check
        run: npm run lint-check
